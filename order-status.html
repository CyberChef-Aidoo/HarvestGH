<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order — HarvestGH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#1a6b3c;--gm:#2d9b5a;--gp:#e8f5ee;--gold:#e8a020;--goldp:#fef3cd;--dark:#0f1f14;--gray:#6b7c6e;--bg:#f0f4f1;--border:rgba(26,107,60,.12);--red:#c0392b;--blue:#1a56db;--orange:#c05621}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--dark)}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:'DM Sans',sans-serif}
.hidden{display:none!important}

.nav{position:fixed;top:0;width:100%;z-index:100;background:rgba(250,247,242,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;padding:0 5%;justify-content:space-between}
.logo{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:900;color:var(--g)}.logo span{color:var(--gold)}
.nav-r a{font-size:.86rem;font-weight:500;color:var(--dark);padding:8px 12px}.nav-r a:hover{color:var(--g)}

.page{padding:84px 5% 60px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.container{width:100%;max-width:600px}

/* ── LOOKUP ── */
.lookup-card{background:#fff;border-radius:20px;padding:36px;border:1px solid var(--border);box-shadow:0 4px 24px rgba(15,31,20,.08);text-align:center;margin-bottom:20px}
.lookup-icon{width:66px;height:66px;border-radius:50%;background:var(--gp);border:2px solid rgba(26,107,60,.15);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:1.7rem}
.lookup-card h1{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:900;margin-bottom:7px}
.lookup-card p{color:var(--gray);font-size:.88rem;line-height:1.65;margin-bottom:22px}
.input-row{display:flex;gap:10px;margin-bottom:8px}
.ref-input{flex:1;padding:12px 16px;border:1.5px solid rgba(26,107,60,.2);border-radius:11px;font-size:.95rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;text-transform:uppercase;letter-spacing:.04em}
.ref-input:focus{border-color:var(--g)}
.ref-input::placeholder{text-transform:none;letter-spacing:0;color:#aab4ac}
.btn-track{background:var(--g);color:#fff;border:none;padding:12px 20px;border-radius:11px;font-size:.9rem;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background .2s;flex-shrink:0}
.btn-track:hover{background:var(--gm)}
.lookup-hint{font-size:.76rem;color:var(--gray)}
.lookup-hint span{font-weight:600;color:var(--g)}
.err-txt{color:var(--red);font-size:.82rem;margin-top:8px;display:none}.err-txt.show{display:block}

/* ── LOADING ── */
.loading-card{background:#fff;border-radius:16px;padding:28px;border:1px solid var(--border);text-align:center}
.spinner{width:30px;height:30px;border:3px solid var(--gp);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ORDER RESULT ── */
.order-card{background:#fff;border-radius:16px;border:1px solid var(--border);overflow:hidden;box-shadow:0 4px 24px rgba(15,31,20,.07);margin-bottom:14px}

.order-header{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.order-ref-num{font-family:'DM Mono',monospace;font-size:1.05rem;font-weight:700;color:var(--g)}
.order-date{font-size:.76rem;color:var(--gray);margin-top:3px}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:100px;font-size:.78rem;font-weight:700}
.s-pending   {background:#eff0ef;color:var(--gray)}
.s-confirmed {background:#e8f0fe;color:var(--blue)}
.s-processing{background:var(--goldp);color:#856404}
.s-dispatched{background:#fde8d8;color:var(--orange)}
.s-delivered {background:var(--gp);color:var(--g)}
.s-cancelled {background:#fdecea;color:var(--red)}

/* ── TIMELINE ── */
.timeline-wrap{padding:22px 22px 8px}
.timeline-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gray);margin-bottom:16px}
.timeline{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding-bottom:4px}
.tl-step{display:flex;flex-direction:column;align-items:center;flex:1;min-width:70px}
.tl-top{display:flex;align-items:center;width:100%;position:relative}
.tl-dot{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:.82rem;z-index:1;flex-shrink:0;transition:all .4s}
.tl-dot.done{background:var(--g);border-color:var(--g);color:#fff}
.tl-dot.active{background:var(--gold);border-color:var(--gold);color:var(--dark);box-shadow:0 0 0 4px rgba(232,160,32,.2)}
.tl-dot.cancelled{background:var(--red);border-color:var(--red);color:#fff}
.tl-line{flex:1;height:2.5px;background:var(--border);transition:background .4s}
.tl-line.done{background:var(--g)}
.tl-step:last-child .tl-top{width:auto}
.tl-step:last-child .tl-line{display:none}
.tl-label{font-size:.66rem;font-weight:600;text-align:center;color:var(--gray);margin-top:7px;white-space:nowrap}
.tl-step.done  .tl-label{color:var(--g);font-weight:700}
.tl-step.active .tl-label{color:var(--gold);font-weight:700}
.tl-step.cancelled .tl-label{color:var(--red);font-weight:700}

/* ── ORDER DETAILS ── */
.order-details{padding:16px 22px;border-top:1px solid var(--border)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.d-item{background:#f8faf8;border-radius:9px;padding:10px 13px}
.d-lbl{font-size:.68rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.d-val{font-size:.9rem;font-weight:600;color:var(--dark)}
.d-val.green{color:var(--g)}
.divider{height:1px;background:var(--border);margin:14px 0}

/* ── PRICE BREAKDOWN ── */
.price-rows{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.price-row{display:flex;justify-content:space-between;font-size:.86rem}
.price-row .lbl{color:var(--gray)}
.price-row .val{font-weight:600}
.price-row.total{padding-top:8px;border-top:1px solid var(--border)}
.price-row.total .lbl{font-weight:700;font-size:.95rem}
.price-row.total .val{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:900;color:var(--g)}

/* ── ACTION BUTTONS ── */
.order-actions{padding:14px 22px 18px;display:flex;gap:9px;flex-wrap:wrap;border-top:1px solid var(--border)}
.btn-wa{background:#25d366;color:#fff;border:none;padding:10px 18px;border-radius:9px;font-size:.84rem;font-weight:700;display:flex;align-items:center;gap:7px;transition:background .2s}
.btn-wa:hover{background:#1db954}
.btn-call{background:#f0f4f1;color:var(--dark);border:none;padding:10px 18px;border-radius:9px;font-size:.84rem;font-weight:700;display:flex;align-items:center;gap:7px;transition:background .2s}
.btn-call:hover{background:var(--gp);color:var(--g)}
.btn-shop{background:var(--g);color:#fff;border:none;padding:10px 18px;border-radius:9px;font-size:.84rem;font-weight:700;display:flex;align-items:center;gap:7px;transition:background .2s}
.btn-shop:hover{background:var(--gm)}

/* ── NOT FOUND ── */
.not-found{background:#fff;border-radius:16px;padding:32px;border:1px solid var(--border);text-align:center}
.not-found h3{font-family:'Fraunces',serif;font-size:1.2rem;margin-bottom:8px}
.not-found p{color:var(--gray);font-size:.87rem;line-height:1.7;margin-bottom:18px}

/* WA FLOAT */
.wa-float{position:fixed;bottom:22px;right:22px;z-index:90;width:50px;height:50px;background:#25d366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(37,211,102,.35);transition:all .25s}
.wa-float:hover{transform:scale(1.1)}
.wa-float svg{width:26px;height:26px}

@media(max-width:480px){.detail-grid{grid-template-columns:1fr}.input-row{flex-direction:column}.btn-track{width:100%;justify-content:center}}

/* ═══════════════════════════════════════════════
   HARVESTGH GLOBAL MOBILE RESPONSIVENESS
   Applied to all pages automatically
═══════════════════════════════════════════════ */
@media (max-width: 768px) {
  /* Typography scale down */
  body { font-size: 15px !important; }
  h1, .sec-h2, .view-title { font-size: clamp(1.4rem, 5vw, 2rem) !important; }
  h2 { font-size: clamp(1.2rem, 4vw, 1.7rem) !important; }

  /* Nav */
  .nav { padding: 0 4% !important; height: 58px !important; }
  .nav-links, .nav-ctas, .nav-r { display: none !important; }
  .hamburger, .mob-close { display: block !important; }

  /* Hero sections */
  .hero { min-height: 90vh !important; }
  .slide-content { padding: 60px 5% 80px !important; }
  .slide-h1 { font-size: clamp(1.6rem, 6vw, 2.5rem) !important; line-height: 1.15 !important; }
  .slide-p { font-size: .9rem !important; }
  .slide-btns { flex-direction: column !important; gap: 10px !important; }
  .slide-btns a, .slide-btns button { width: 100% !important; justify-content: center !important; }

  /* Grids → single column */
  .checkout-grid, .mission-grid, .problem-grid,
  .story-grid, .cta-section, .fbo-grid,
  .how-grid, .contact-grid, .hero { grid-template-columns: 1fr !important; }

  /* Card grids → 1 or 2 cols */
  .products-grid, .produce-grid, .feat-grid,
  .testi-grid, .what-grid { grid-template-columns: 1fr !important; }
  .kpi-row, .ls-grid, .trust-strip { grid-template-columns: 1fr 1fr !important; }
  .seasonal-grid { grid-template-columns: repeat(2, 1fr) !important; }
  .mosaic-grid { grid-template-columns: 1fr 1fr !important; grid-template-rows: auto !important; }
  .mosaic-item.tall { grid-row: span 1 !important; }

  /* Forms */
  .form-row { grid-template-columns: 1fr !important; }
  .type-row { grid-template-columns: 1fr !important; }
  .quick-form { grid-template-columns: 1fr !important; }

  /* Footer */
  .footer-grid, .ft-grid { grid-template-columns: 1fr !important; gap: 22px !important; }
  .footer-bottom, .ft-bottom { flex-direction: column !important; gap: 8px !important; }
  .ft-bottom-links, .ft-bottom-r { flex-wrap: wrap !important; gap: 12px !important; }

  /* Buttons */
  .btn-hero-g, .btn-hero-out { padding: 12px 20px !important; font-size: .88rem !important; }
  .cta-btns { flex-direction: column !important; }
  .cta-btns button, .cta-btns a { width: 100% !important; }

  /* Tables */
  .tbl-wrap, table { overflow-x: auto !important; display: block !important; }
  table { min-width: 500px !important; }

  /* Order detail modal */
  .order-detail-grid { grid-template-columns: 1fr !important; }

  /* Filter bars */
  .filters-bar, .filters { flex-wrap: wrap !important; }
  .f-search, .f-sel { min-width: calc(50% - 6px) !important; }

  /* Sections padding */
  .section, .why-section, .testi-section, .mosaic-section,
  .how-section, .fbo-section, .cta-section, .story, .mission,
  .what-section, .about-cta, .seasonal-section { padding: 44px 5% !important; }

  /* Image heights */
  .mission-img-wrap, .how-img-wrap { height: 220px !important; }
  .founder-card { position: static !important; }
  .fbo-card-stack { height: 260px !important; }

  /* Trust strip */
  .trust-val { font-size: 1.7rem !important; }
  .trust-lbl { font-size: .68rem !important; }

  /* WA float position */
  .wa-float { bottom: 16px !important; right: 16px !important; width: 48px !important; height: 48px !important; }
}

@media (max-width: 480px) {
  .kpi-row, .trust-strip, .ls-grid { grid-template-columns: 1fr 1fr !important; }
  .seasonal-grid { grid-template-columns: repeat(2, 1fr) !important; }
  .mosaic-grid { grid-template-columns: 1fr !important; }
  .hero-arrow { display: none !important; }
  .slide-h1 { font-size: clamp(1.4rem, 7vw, 2rem) !important; }
  .img-arrow { display: none !important; }
  .money-split { grid-template-columns: 1fr !important; }
  .benefit-grid { grid-template-columns: 1fr !important; }
}

</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo">Harvest<span>GH</span></a>
  <div class="nav-r">
    <a href="listings.html">Shop</a>
    <a href="contact.html">Help</a>
  </div>
</nav>

<div class="page">
  <div class="container">

    <!-- LOOKUP CARD -->
    <div class="lookup-card">
      <div class="lookup-icon">📦</div>
      <h1>Track Your Order</h1>
      <p>Enter your order reference number to see your delivery status and order details.</p>
      <div class="input-row">
        <input type="text" id="refInput" class="ref-input" placeholder="e.g. HGH-2026-4721" maxlength="14" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')trackOrder()">
        <button class="btn-track" id="trackBtn" onclick="trackOrder()">
          <span id="trackLbl">Track</span>
          <span style="width:15px;height:15px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none" id="trackSp"></span>
        </button>
      </div>
      <div class="err-txt" id="errTxt">Please enter a valid order reference (e.g. HGH-2026-4721)</div>
      <div class="lookup-hint">Your order reference was sent to your phone by SMS after ordering. You can also <span onclick="showPhoneSearch()" style="cursor:pointer">search by phone number</span>.</div>
      <!-- Phone search (hidden by default) -->
      <div id="phoneSearchWrap" style="display:none;margin-top:14px">
        <div class="input-row">
          <input type="tel" id="phoneInput" class="ref-input" placeholder="024 123 4567" style="text-transform:none;letter-spacing:0" oninput="fmtPhone(event)" onkeydown="if(event.key==='Enter')trackByPhone()">
          <button class="btn-track" onclick="trackByPhone()">Search</button>
        </div>
      </div>
    </div>

    <!-- RESULT AREA -->
    <div id="resultArea"></div>

  </div>
</div>

<a class="wa-float" id="waFloat" href="https://wa.me/233544823484" target="_blank" title="Chat on WhatsApp">
  <i class="fab fa-whatsapp" style="font-size:1.6rem;color:#fff;line-height:1"></i>
</a>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL  = (window.HARVESTGH && window.HARVESTGH.supabaseUrl) || 'YOUR_SUPABASE_URL_HERE';
const SUPABASE_ANON = (window.HARVESTGH && window.HARVESTGH.supabaseAnon) || 'YOUR_SUPABASE_ANON_KEY_HERE';
let db = null;
try {
  const {createClient} = supabase;
  const _u=(window.HARVESTGH&&window.HARVESTGH.supabaseUrl)||SUPABASE_URL;
  const _k=(window.HARVESTGH&&window.HARVESTGH.supabaseAnon)||SUPABASE_ANON;
  if(_u&&!_u.includes('YOUR_'))db=createClient(_u,_k);
}catch(e){console.warn('Supabase:',e.message);}

let supportPhone = '0544823484', waNumber = '233544823484';

const STATUS_STEPS = ['pending','confirmed','processing','dispatched','delivered'];
const STATUS_ICONS = {pending:'⏳',confirmed:'✓',processing:'⚙️',dispatched:'🚚',delivered:'✅',cancelled:'✕'};
const STATUS_LABELS = {pending:'Order Placed',confirmed:'Confirmed',processing:'Processing',dispatched:'On the Way',delivered:'Delivered',cancelled:'Cancelled'};

async function init() {
  await loadSettings();
  const params = new URLSearchParams(window.location.search);
  const ref    = params.get('ref');
  if (ref) { document.getElementById('refInput').value = ref.toUpperCase(); trackOrder(); }
}

async function loadSettings() {
  try {
    const {data} = await db.from('site_settings').select('*');
    const m = {}; (data||[]).forEach(s => m[s.key] = s.value);
    if (m.contact_phone) { supportPhone = m.contact_phone; }
    if (m.whatsapp)      { waNumber = m.whatsapp; document.getElementById('waFloat').href = 'https://wa.me/'+m.whatsapp; }
  } catch(e) {}
}

function fmtPhone(e) {
  let v = e.target.value.replace(/\D/g,'').slice(0,10);
  if (v.length > 6) v = v.slice(0,3)+' '+v.slice(3,6)+' '+v.slice(6);
  else if (v.length > 3) v = v.slice(0,3)+' '+v.slice(3);
  e.target.value = v;
}

function showPhoneSearch() {
  document.getElementById('phoneSearchWrap').style.display = 'block';
}

function setLoading(on) {
  document.getElementById('trackBtn').disabled = on;
  document.getElementById('trackLbl').style.display = on ? 'none' : 'inline';
  document.getElementById('trackSp').style.display  = on ? 'inline-block' : 'none';
}

async function trackOrder() {
  const ref = document.getElementById('refInput').value.trim().toUpperCase();
  const err = document.getElementById('errTxt');
  if (!ref || !ref.startsWith('HGH-')) { err.classList.add('show'); return; }
  err.classList.remove('show');
  setLoading(true);
  document.getElementById('resultArea').innerHTML = '';
  try {
    const {data, error} = await db.from('orders').select('*').eq('order_ref', ref).single();
    if (error || !data) { renderNotFound(ref); return; }
    renderOrder([data]);
  } catch(e) { renderNotFound(ref); }
  finally { setLoading(false); }
}

async function trackByPhone() {
  const raw   = document.getElementById('phoneInput').value.replace(/\s/g,'');
  if (raw.length < 9) return;
  const local = raw.startsWith('0') ? raw : '0'+raw.slice(-9);
  const intl  = '233'+raw.slice(-9);
  setLoading(true);
  document.getElementById('resultArea').innerHTML = '';
  try {
    const {data} = await db.from('orders').select('*')
      .or(`buyer_phone.eq.${local},buyer_phone.eq.${intl},buyer_phone.eq.${raw}`)
      .order('created_at', {ascending: false});
    if (!data || !data.length) { renderNotFound(raw, true); return; }
    renderOrder(data);
  } catch(e) { renderNotFound(raw, true); }
  finally { setLoading(false); }
}

function renderOrder(orders) {
  const html = orders.map(o => buildOrderCard(o)).join('');
  document.getElementById('resultArea').innerHTML = html;
  // Scroll to result
  document.getElementById('resultArea').scrollIntoView({behavior:'smooth',block:'start'});
}

function buildOrderCard(o) {
  const statusClass   = 's-' + o.order_status;
  const statusLabel   = STATUS_LABELS[o.order_status] || o.order_status;
  const statusIcon    = STATUS_ICONS[o.order_status]  || '•';
  const isCancelled   = o.order_status === 'cancelled';
  const currentStep   = isCancelled ? -1 : STATUS_STEPS.indexOf(o.order_status);

  // Build timeline
  const timelineHtml = STATUS_STEPS.map((step, i) => {
    let cls = '';
    if (isCancelled)             cls = '';
    else if (i < currentStep)    cls = 'done';
    else if (i === currentStep)  cls = 'active';
    return `
      <div class="tl-step ${cls}">
        <div class="tl-top">
          <div class="tl-dot ${cls}">${i < currentStep ? '✓' : STATUS_ICONS[step]}</div>
          <div class="tl-line ${i < currentStep ? 'done' : ''}"></div>
        </div>
        <div class="tl-label">${STATUS_LABELS[step]}</div>
      </div>`;
  }).join('');

  // Cancelled override
  const cancelledHtml = isCancelled ? `<div style="background:#fdecea;border-radius:9px;padding:10px 14px;margin:10px 22px;font-size:.84rem;color:var(--red);font-weight:600">❌ This order was cancelled. Contact us for help.</div>` : '';

  return `
  <div class="order-card">
    <div class="order-header">
      <div>
        <div class="order-ref-num">${o.order_ref}</div>
        <div class="order-date">Placed ${fmtDate(o.created_at)}</div>
      </div>
      <span class="status-badge ${statusClass}">${statusIcon} ${statusLabel}</span>
    </div>

    <div class="timeline-wrap">
      <div class="timeline-label">Order Progress</div>
      <div class="timeline">${isCancelled ? '<div style="color:var(--red);font-size:.84rem;font-weight:600;padding:4px 0">❌ Order Cancelled</div>' : timelineHtml}</div>
    </div>

    ${cancelledHtml}

    <div class="order-details">
      <div class="detail-grid">
        <div class="d-item"><div class="d-lbl">Product</div><div class="d-val">${o.product_name}</div></div>
        <div class="d-item"><div class="d-lbl">Quantity</div><div class="d-val">${o.quantity} ${o.product_unit}${o.quantity>1?'s':''}</div></div>
        <div class="d-item"><div class="d-lbl">Delivery To</div><div class="d-val">${o.delivery_region||'—'}</div></div>
        <div class="d-item"><div class="d-lbl">Order Type</div><div class="d-val">${o.order_type === 'preorder' ? '📅 Preorder' : '✅ Direct Buy'}</div></div>
        ${o.delivery_address ? `<div class="d-item" style="grid-column:1/-1"><div class="d-lbl">Delivery Address</div><div class="d-val">${o.delivery_address}</div></div>` : ''}
      </div>

      <div class="divider"></div>

      <div class="price-rows">
        <div class="price-row"><span class="lbl">Subtotal</span><span class="val">GH₵${parseFloat(o.subtotal).toFixed(2)}</span></div>
        <div class="price-row"><span class="lbl">Delivery Fee</span><span class="val">GH₵${parseFloat(o.delivery_fee||0).toFixed(2)}</span></div>
        <div class="price-row"><span class="lbl">Payment Status</span><span class="val" style="color:${o.payment_status==='paid'?'var(--g)':'var(--gold)'}">${o.payment_status==='paid'?'✅ Paid':'⏳ Pending'}</span></div>
        <div class="price-row total"><span class="lbl">Total</span><span class="val">GH₵${parseFloat(o.total_price).toFixed(2)}</span></div>
      </div>
    </div>

    <div class="order-actions">
      <a href="https://wa.me/${waNumber}?text=Hi HarvestGH, I need help with my order ${o.order_ref}" target="_blank">
        <button class="btn-wa">💬 WhatsApp Support</button>
      </a>
      <a href="tel:${supportPhone}">
        <button class="btn-call">📞 Call Us</button>
      </a>
      <a href="listings.html">
        <button class="btn-shop">🛒 Shop More</button>
      </a>
    </div>
  </div>`;
}

function renderNotFound(ref, isPhone = false) {
  document.getElementById('resultArea').innerHTML = `
    <div class="not-found">
      <div style="font-size:2.4rem;margin-bottom:12px">🔍</div>
      <h3>Order Not Found</h3>
      <p>We could not find an order with ${isPhone ? 'phone number' : 'reference'} <strong>${ref}</strong>.<br>
      Make sure you entered it correctly, or contact us for help.</p>
      <div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center">
        <a href="https://wa.me/${waNumber}" target="_blank" style="background:#25d366;color:#fff;padding:10px 18px;border-radius:9px;font-size:.86rem;font-weight:700">💬 WhatsApp Us</a>
        <a href="tel:${supportPhone}" style="background:var(--gp);color:var(--g);padding:10px 18px;border-radius:9px;font-size:.86rem;font-weight:700">📞 Call ${supportPhone}</a>
        <a href="listings.html" style="background:var(--g);color:#fff;padding:10px 18px;border-radius:9px;font-size:.86rem;font-weight:700">Browse Shop</a>
      </div>
    </div>`;
}

function fmtDate(d) {
  return new Date(d).toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});
}

init();
</script>

<script src="chatbot.js"></script>
</body>
</html>
