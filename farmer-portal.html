<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check My Listing — HarvestGH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#1a6b3c;--gm:#2d9b5a;--gp:#e8f5ee;--gold:#e8a020;--dark:#0f1f14;--gray:#6b7c6e;--bg:#f0f4f1;--border:rgba(26,107,60,.12);--red:#c0392b}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--dark)}
a{text-decoration:none;color:inherit} button{cursor:pointer;font-family:'DM Sans',sans-serif}
.hidden{display:none!important}

.nav{position:fixed;top:0;width:100%;z-index:100;background:rgba(250,247,242,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);height:64px;display:flex;align-items:center;padding:0 5%;justify-content:space-between}
.logo{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:900;color:var(--g)}.logo span{color:var(--gold)}
.nav-r{display:flex;gap:9px;align-items:center}
.nav-link{font-size:.86rem;font-weight:500;color:var(--dark);padding:8px 12px}.nav-link:hover{color:var(--g)}
.btn-g{background:var(--g);color:#fff;border:none;padding:9px 17px;border-radius:9px;font-size:.84rem;font-weight:600}

.wrapper{min-height:100vh;padding:84px 5% 60px;display:flex;align-items:flex-start;justify-content:center}
.container{width:100%;max-width:560px}

/* LOOKUP CARD */
.lookup-card{background:#fff;border-radius:20px;padding:38px;box-shadow:0 8px 40px rgba(15,31,20,.1);text-align:center}
.lookup-icon{width:70px;height:70px;border-radius:50%;background:var(--gp);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.lookup-card h1{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:900;margin-bottom:7px}
.lookup-card p{color:var(--gray);font-size:.9rem;line-height:1.6;margin-bottom:26px}
.phone-input-wrap{display:flex;gap:10px;margin-bottom:10px}
.phone-input{flex:1;padding:13px 16px;border:1.5px solid rgba(26,107,60,.2);border-radius:12px;font-size:1rem;font-family:'DM Sans',sans-serif;outline:none;transition:border-color .2s;text-align:center;letter-spacing:.05em}
.phone-input:focus{border-color:var(--g)}
.phone-input::placeholder{color:#aab4ac;letter-spacing:0}
.btn-lookup{background:var(--g);color:#fff;border:none;padding:13px 22px;border-radius:12px;font-size:.92rem;font-weight:700;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:background .2s}
.btn-lookup:hover{background:var(--gm)}
.lookup-hint{font-size:.78rem;color:var(--gray);margin-top:4px}
.err-txt{color:var(--red);font-size:.82rem;margin-top:8px;display:none}.err-txt.show{display:block}

/* RESULTS */
.results-section{margin-top:20px}
.result-card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(15,31,20,.08);margin-bottom:14px;border:1px solid var(--border)}
.rc-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.rc-title{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:700}
.rc-sub{font-size:.8rem;color:var(--gray);margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:100px;font-size:.75rem;font-weight:700;white-space:nowrap}
.b-available{background:var(--gp);color:var(--g)}
.b-matched{background:#fef3cd;color:#856404}
.b-sold{background:#e8f0fe;color:#1a56db}
.b-managed{background:#f0f0f0;color:var(--gray)}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.info-item{background:#f8faf8;border-radius:9px;padding:10px 13px}
.info-lbl{font-size:.7rem;color:var(--gray);margin-bottom:2px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.info-val{font-size:.9rem;font-weight:600;color:var(--dark)}

/* MATCH FOUND BOX */
.match-found{background:linear-gradient(135deg,#1a6b3c,#2d9b5a);border-radius:12px;padding:20px;color:#fff;margin-bottom:14px}
.match-found h3{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:900;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.match-found p{font-size:.85rem;opacity:.85;line-height:1.6;margin-bottom:14px}
.match-contact{background:rgba(255,255,255,.15);border-radius:9px;padding:13px 16px;font-size:.88rem}
.mc-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.7;margin-bottom:5px}
.mc-val{font-weight:700;font-size:.95rem}
.mc-phone{font-size:1.2rem;font-weight:900;letter-spacing:.03em;margin-top:3px}
.call-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;color:var(--g);border:none;border-radius:9px;padding:11px;width:100%;font-size:.9rem;font-weight:700;margin-top:12px;cursor:pointer;transition:all .2s}
.call-btn:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.15)}

/* STATUS TIMELINE */
.timeline{margin-bottom:14px}
.tl-title{font-size:.78rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.tl-steps{display:flex;align-items:center;gap:0}
.tl-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
.tl-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;z-index:1;transition:all .3s;flex-shrink:0}
.tl-dot.done{background:var(--g);border-color:var(--g);color:#fff}
.tl-dot.active{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.tl-line{position:absolute;top:13px;left:50%;right:-50%;height:2px;background:var(--border);z-index:0}
.tl-step:last-child .tl-line{display:none}
.tl-line.done{background:var(--g)}
.tl-label{font-size:.65rem;color:var(--gray);margin-top:5px;text-align:center;font-weight:500}
.tl-step.active .tl-label{color:var(--gold);font-weight:700}
.tl-step.done .tl-label{color:var(--g);font-weight:600}

/* NO RESULTS */
.no-results{text-align:center;padding:28px;background:#fff;border-radius:16px;border:1px solid var(--border)}
.no-results h3{font-family:'Fraunces',serif;font-size:1.2rem;margin-bottom:8px}
.no-results p{color:var(--gray);font-size:.87rem;line-height:1.7}

/* SPINNER */
.spinner{width:28px;height:28px;border:3px solid var(--gp);border-top-color:var(--g);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
.loading-box{text-align:center;padding:28px;background:#fff;border-radius:16px;border:1px solid var(--border)}
.loading-box p{color:var(--gray);font-size:.87rem;margin-top:12px}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:20px;right:20px;background:var(--dark);color:#fff;padding:12px 17px;border-radius:10px;font-size:.83rem;font-weight:500;z-index:9999;max-width:290px;box-shadow:0 6px 24px rgba(0,0,0,.2);transform:translateY(80px);opacity:0;transition:all .3s}
.toast.show{transform:translateY(0);opacity:1}.toast.error{background:var(--red)}

@media(max-width:480px){.phone-input-wrap{flex-direction:column}.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo">Harvest<span>GH</span></a>
  <div class="nav-r">
    <a href="listings.html" class="nav-link">Marketplace</a>
    <a href="register-farmer.html"><button class="btn-g">Register</button></a>
  </div>
</nav>

<div class="wrapper">
  <div class="container">

    <!-- LOOKUP -->
    <div class="lookup-card" id="lookupCard">
      <div class="lookup-icon">📱</div>
      <h1>Check My Listing</h1>
      <p>Enter the phone number you used to register on HarvestGH. We will show you your listing status and whether a buyer has been found for you.</p>
      <div class="phone-input-wrap">
        <input type="tel" id="phoneInput" class="phone-input" placeholder="024 123 4567" maxlength="13" oninput="formatPhone(event)" onkeydown="if(event.key==='Enter')lookup()">
        <button class="btn-lookup" id="lookupBtn" onclick="lookup()">
          <span id="lookupLabel">Check</span>
          <span class="hidden" id="lookupSpinner" style="width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block"></span>
        </button>
      </div>
      <div class="err-txt" id="errTxt">Please enter a valid phone number.</div>
      <div class="lookup-hint">Your phone number is private and only used to find your registration.</div>
    </div>

    <!-- RESULTS -->
    <div class="results-section hidden" id="resultsSection"></div>

  </div>
</div>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ╔══════════════════════════════════════╗
// ║  FILL IN YOUR CREDENTIALS HERE      ║
// ╚══════════════════════════════════════╝
const SUPABASE_URL  = 'YOUR_SUPABASE_URL_HERE';
const SUPABASE_ANON = 'YOUR_SUPABASE_ANON_KEY_HERE';

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

let supportPhone = '0544823484';

function formatPhone(e) {
  let v = e.target.value.replace(/\D/g,'').slice(0,10);
  if (v.length > 6) v = v.slice(0,3)+' '+v.slice(3,6)+' '+v.slice(6);
  else if (v.length > 3) v = v.slice(0,3)+' '+v.slice(3);
  e.target.value = v;
}

async function loadSettings() {
  try {
    const { data } = await db.from('site_settings').select('*');
    const m = {};
    (data||[]).forEach(s => m[s.key] = s.value);
    if (m.contact_phone) supportPhone = m.contact_phone;
  } catch(e) {}
}

function fmtDate(d) {
  return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
}

async function lookup() {
  const raw   = document.getElementById('phoneInput').value.replace(/\s/g,'');
  const err   = document.getElementById('errTxt');
  if (raw.length < 9) { err.classList.add('show'); return; }
  err.classList.remove('show');

  // set loading
  document.getElementById('lookupBtn').disabled = true;
  document.getElementById('lookupLabel').classList.add('hidden');
  document.getElementById('lookupSpinner').classList.remove('hidden');

  // Try both formats: 0XXXXXXXXX and 233XXXXXXXXX
  const localFmt = raw.startsWith('0') ? raw : '0'+raw.slice(-9);
  const intlFmt  = raw.startsWith('233') ? raw : '233'+raw.slice(-9);

  try {
    // Look up farmer by phone (try both formats)
    const { data: farmers } = await db.from('farmers').select('*')
      .or(`phone.eq.${localFmt},phone.eq.${intlFmt},phone.eq.${raw}`);

    if (!farmers || !farmers.length) {
      showNoResults(localFmt); return;
    }

    // For each farmer, get their listings and matches
    const farmerIds = farmers.map(f => f.id);
    const [{ data: listings }, { data: matches }] = await Promise.all([
      db.from('listings').select('*').in('farmer_id', farmerIds).order('created_at',{ascending:false}),
      db.from('matches').select('*').in('farmer_id', farmerIds).order('created_at',{ascending:false})
    ]);

    showResults(farmers, listings||[], matches||[]);
  } catch(e) {
    console.error(e);
    showToast('Could not connect. Please check your connection and try again.','error');
  } finally {
    document.getElementById('lookupBtn').disabled = false;
    document.getElementById('lookupLabel').classList.remove('hidden');
    document.getElementById('lookupSpinner').classList.add('hidden');
  }
}

function showNoResults(phone) {
  const wrap = document.getElementById('resultsSection');
  wrap.classList.remove('hidden');
  wrap.innerHTML = `
    <div class="no-results">
      <div style="font-size:2rem;margin-bottom:10px">🔍</div>
      <h3>No Registration Found</h3>
      <p>We could not find an account registered with <strong>${phone}</strong>.<br>
      Make sure you are using the exact phone number you registered with.</p>
      <div style="margin-top:18px;display:flex;flex-direction:column;gap:9px">
        <a href="register-farmer.html" style="background:var(--g);color:#fff;padding:11px 20px;border-radius:10px;font-size:.88rem;font-weight:700;text-align:center;display:block">Register as a New Farmer</a>
        <a href="tel:${supportPhone}" style="background:var(--gp);color:var(--g);padding:11px 20px;border-radius:10px;font-size:.88rem;font-weight:700;text-align:center;display:block">📞 Call for Help: ${supportPhone}</a>
      </div>
    </div>`;
}

function showResults(farmers, listings, matches) {
  const wrap = document.getElementById('resultsSection');
  wrap.classList.remove('hidden');
  let html = '';

  farmers.forEach(farmer => {
    const farmerListings = listings.filter(l => l.farmer_id === farmer.id);
    const farmerMatches  = matches.filter(m => m.farmer_id === farmer.id);
    const latestMatch    = farmerMatches[0] || null;
    const latestListing  = farmerListings[0] || null;

    // Determine overall status
    let overallStatus = 'registered';
    if (latestListing?.status === 'matched' || latestMatch) overallStatus = 'matched';
    else if (latestListing?.status === 'available') overallStatus = 'listed';
    else if (latestListing?.status === 'sold') overallStatus = 'sold';
    else if (farmer.account_type === 'managed') overallStatus = 'managed';

    // Timeline step
    const steps = [
      { label:'Registered', done: true },
      { label:'Listed',     done: overallStatus==='listed'||overallStatus==='matched'||overallStatus==='sold' },
      { label:'Matched',    done: overallStatus==='matched'||overallStatus==='sold' },
      { label:'Sold',       done: overallStatus==='sold' }
    ];
    const activeIdx = steps.map(s=>s.done).lastIndexOf(true);
    const timelineHtml = `
      <div class="timeline">
        <div class="tl-title">Your Progress</div>
        <div class="tl-steps">
          ${steps.map((s,i)=>`
            <div class="tl-step ${s.done?(i===activeIdx?'active':'done'):''}">
              <div class="tl-line ${i<activeIdx?'done':''}"></div>
              <div class="tl-dot ${s.done?(i===activeIdx?'active':'done'):''}">
                ${s.done ? (i===activeIdx ? '●' : '✓') : (i+1)}
              </div>
              <div class="tl-label">${s.label}</div>
            </div>`).join('')}
        </div>
      </div>`;

    // Status badge
    let badgeHtml = '';
    if (overallStatus==='managed')  badgeHtml = '<span class="badge b-managed">Managed by HarvestGH</span>';
    else if (overallStatus==='listed')  badgeHtml = '<span class="badge b-available">Listing Active</span>';
    else if (overallStatus==='matched') badgeHtml = '<span class="badge b-matched">Buyer Matched!</span>';
    else if (overallStatus==='sold')    badgeHtml = '<span class="badge b-sold">Sold</span>';
    else                                badgeHtml = '<span class="badge b-managed">Registered</span>';

    // Match found box
    let matchHtml = '';
    if (latestMatch) {
      matchHtml = `
        <div class="match-found">
          <h3>🎉 A Buyer Has Been Found!</h3>
          <p>A buyer was matched with your ${latestMatch.crop_type} listing on ${fmtDate(latestMatch.created_at)}. Contact them using the details below to arrange delivery and payment.</p>
          <div class="match-contact">
            <div class="mc-label">Buyer Contact</div>
            <div class="mc-val">${latestMatch.buyer_name}</div>
            <div class="mc-phone">${latestMatch.buyer_phone}</div>
          </div>
          <a href="tel:${latestMatch.buyer_phone}">
            <button class="call-btn">📞 Call Buyer Now</button>
          </a>
        </div>`;
    } else if (overallStatus === 'managed') {
      matchHtml = `
        <div style="background:var(--gp);border-radius:12px;padding:16px;margin-bottom:14px;font-size:.86rem;color:var(--g);line-height:1.6">
          <strong>Your account is managed by HarvestGH.</strong><br>
          We are actively looking for a buyer for your crop. You will receive a phone call on <strong>${farmer.phone}</strong> as soon as we find one. No action needed from you.
        </div>`;
    }

    // Listing details
    let listingHtml = '';
    if (latestListing) {
      listingHtml = `
        <div class="info-grid">
          <div class="info-item"><div class="info-lbl">Crop</div><div class="info-val">${latestListing.crop_type}</div></div>
          <div class="info-item"><div class="info-lbl">Quantity</div><div class="info-val">${latestListing.quantity}</div></div>
          <div class="info-item"><div class="info-lbl">Price / Unit</div><div class="info-val">GH₵ ${latestListing.price_per_unit}</div></div>
          <div class="info-item"><div class="info-lbl">Region</div><div class="info-val">${latestListing.region}</div></div>
          ${latestListing.pickup_location?`<div class="info-item" style="grid-column:1/-1"><div class="info-lbl">Pickup Location</div><div class="info-val">${latestListing.pickup_location}</div></div>`:''}
        </div>`;
    } else if (farmer.account_type !== 'managed') {
      listingHtml = `
        <div style="background:#fef3cd;border-radius:9px;padding:12px 14px;margin-bottom:12px;font-size:.84rem;color:#856404">
          You are registered but have not posted a listing yet.
          <a href="register-farmer.html" style="color:var(--g);font-weight:700;margin-left:6px">Post a listing →</a>
        </div>`;
    }

    html += `
      <div class="result-card">
        <div class="rc-header">
          <div>
            <div class="rc-title">👋 Hello, ${farmer.full_name}</div>
            <div class="rc-sub">Registered on ${fmtDate(farmer.created_at)} · ${farmer.region}</div>
          </div>
          ${badgeHtml}
        </div>
        ${timelineHtml}
        ${matchHtml}
        ${listingHtml}
        <div style="padding-top:12px;border-top:1px solid var(--border);display:flex;gap:9px;flex-wrap:wrap">
          <a href="listings.html" style="background:var(--gp);color:var(--g);padding:9px 16px;border-radius:9px;font-size:.82rem;font-weight:600">Browse Marketplace</a>
          <a href="tel:${supportPhone}" style="background:#f0f4f1;color:var(--dark);padding:9px 16px;border-radius:9px;font-size:.82rem;font-weight:600">📞 Call Support</a>
        </div>
      </div>`;
  });

  // Show total listings and matches summary at bottom
  if (listings.length > 1 || matches.length > 1) {
    html += `
      <div style="background:#fff;border-radius:12px;padding:16px 18px;border:1px solid var(--border);font-size:.84rem;color:var(--gray)">
        You have <strong style="color:var(--dark)">${listings.length} listing${listings.length!==1?'s':''}</strong> and
        <strong style="color:var(--dark)">${matches.length} match${matches.length!==1?'es':''}</strong> in total on HarvestGH.
        <a href="listings.html" style="color:var(--g);font-weight:600;margin-left:6px">Browse marketplace →</a>
      </div>`;
  }

  wrap.innerHTML = html;
  wrap.scrollIntoView({ behavior:'smooth', block:'start' });
}

function showToast(msg,type='') {
  const t=document.getElementById('toast');t.textContent=msg;t.className=`toast ${type} show`;
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),4000);
}

loadSettings();
</script>

<!-- WHATSAPP FLOAT -->

</a>


<script src="chatbot.js"></script>
<script src="config.js"></script>
</body>
